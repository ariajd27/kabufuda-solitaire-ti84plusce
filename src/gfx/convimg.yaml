palettes:
  - name: global_palette
    fixed-entries:
      - color: {index: 0, r: 255, g: 255, b: 255}
      - color: {index: 1, r: 0, g: 0, b: 0}
      - color: {index: 2, r: 255, g: 0, b: 0}
      - color: {index: 3, r: 5, g: 110, b: 45}
    images: automatic
  - name: binary
    fixed-entries:
      - color: {index: 0, r: 255, g: 255, b: 255}
      - color: {index: 1, r: 0, g: 0, b: 0}

converts:
  - name: sprites
    style: palette
    palette: global_palette
    transparent-color-index: 3
    images:
      - card_back.png
      - crown.png
  - name: numerals
    style: palette
    bpp: 1
    width-and-height: false
    palette: binary
    tilesets:
      tile-width: 8
      tile-height: 5
      images:
       - numerals.png
  - name: small_suits
    style: palette
    bpp: 1
    width-and-height: false
    palette: binary
    tilesets:
      tile-width: 8
      tile-height: 4
      images:
       - small_suits.png
  - name: medium_suits
    style: palette
    bpp: 1
    width-and-height: false
    palette: binary
    tilesets:
      tile-width: 8
      tile-height: 6
      images:
       - medium_suits.png
       - selcorner.png

outputs:
  - type: c
    include-file: gfx.h
    palettes:
      - global_palette
    converts:
      - sprites
      - numerals
      - small_suits
      - medium_suits

